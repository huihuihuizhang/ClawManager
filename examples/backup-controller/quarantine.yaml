apiVersion: v1
kind: Namespace
metadata:
  name: cm-drill-fixture
  labels:
    backup.clawmanager.io/quarantine: 'true'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-worker
  namespace: cm-drill-fixture
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-quarantine
  namespace: cm-drill-fixture
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
